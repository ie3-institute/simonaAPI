plugins {
  id 'groovy' // groovy support
  id 'java' // java support
  id 'scala' // scala support
  id 'com.diffplug.spotless' version '8.10.2'//code format
  id 'pmd' // code check, working on source code
  id 'com.github.spotbugs' version '6.5.11' // code check, working on byte code
  id "org.sonarqube" version "7.5.0.8588" // sonarqube
  id 'signing'
  id 'maven-publish' // publish to a maven repo (local or mvn central, has to be defined)
  id 'jacoco' // java code coverage plugin
  id 'net.thauvin.erik.gradle.semver' version '1.0.4' // semantic versioning
  id 'kr.motd.sphinx' version '2.10.1' // documentation generation
  id 'com.gradleup.shadow' version '9.6.1' // fat jar
}

ext {
  javaVersion = JavaVersion.VERSION_21
  scriptsLocation = 'gradle' + File.separator + 'scripts' + File.separator // location of script plugins

  // required for pekko
  scalaVersion = '3'
  scalaBinaryVersion = '3.8.4'
  pekkoVersion = "1.7.0"
  scapegoatVersion = '3.3.6'

  scala3compilerOptions = [
    "-print-tasty",
    "-feature",
    "-language:implicitConversions",
    "-language:existentials",
    "-Wunused:all",
    "-Xmax-inlines:128",
    "-Xunchecked-java-output-version:21"
  ]
}

group = 'com.github.ie3-institute'
description = 'simonaAPI'

java {
  sourceCompatibility = javaVersion
  targetCompatibility = javaVersion
}

apply from: scriptsLocation + 'spotless.gradle'
apply from: scriptsLocation + 'pmd.gradle'
apply from: scriptsLocation + 'spotbugs.gradle'
apply from: scriptsLocation + 'sonarqube.gradle'
apply from: scriptsLocation + 'checkJavaVersion.gradle'
apply from: scriptsLocation + 'semVer.gradle'
apply from: scriptsLocation + 'uploadToMavenCentralPortal.gradle' // upload for deploy
apply from: scriptsLocation + 'stagingAtMavenCentralPortal.gradle' // stage for deploy
apply from: scriptsLocation + 'jacoco.gradle'
apply from: scriptsLocation + 'documentation.gradle'
apply from: scriptsLocation + 'test.gradle'
apply from: scriptsLocation + 'branchName.gradle'

configurations {
  scalaCompilerPlugin
}

repositories {
  mavenCentral()
}

dependencies{

  implementation 'tech.units:indriya:2.2.4' // quantities

  implementation 'com.github.spotbugs:spotbugs-annotations:4.10.4' // java annotations

  // scala (needed for pekko)
  implementation "org.scala-lang:scala3-library_${scalaVersion}:${scalaBinaryVersion}"

  //PSU
  implementation('com.github.ie3-institute:PowerSystemUtils:3.2.2') {
    exclude group: 'org.apache.logging.log4j'
    exclude group: 'org.slf4j'
    /* Exclude our own nested dependencies */
    exclude group: 'com.github.ie3-institute'
  }

  //PSDM
  implementation('com.github.ie3-institute:PowerSystemDataModel:9.1.0') {
    exclude group: 'org.apache.logging.log4j'
    exclude group: 'org.slf4j'
    /* Exclude our own nested dependencies */
    exclude group: 'com.github.ie3-institute'
  }

  // logging
  implementation platform('org.apache.logging.log4j:log4j-bom:2.26.1')
  implementation 'org.apache.logging.log4j:log4j-api' // log4j
  implementation 'org.apache.logging.log4j:log4j-core' // log4j
  implementation 'org.apache.logging.log4j:log4j-slf4j-impl' // log4j -> slf4j

  // pekko
  implementation "org.apache.pekko:pekko-actor-typed_${scalaVersion}:${pekkoVersion}"

  /* Scala compiler plugin for static code analysis */
  implementation "com.sksamuel.scapegoat:scalac-scapegoat-plugin_${scalaBinaryVersion}:${scapegoatVersion}"
  scalaCompilerPlugin "com.sksamuel.scapegoat:scalac-scapegoat-plugin_${scalaBinaryVersion}:${scapegoatVersion}"

  // TESTING
  testImplementation "org.scalatest:scalatest_${scalaVersion}:3.2.20"
  testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
  testImplementation 'org.apache.groovy:groovy:5.1.2'
  testImplementation 'org.spockframework:spock-core:2.4-groovy-5.0'
  testImplementation "org.apache.pekko:pekko-actor-testkit-typed_${scalaVersion}:${pekkoVersion}" // pekko typed testkit
}

tasks.shadowJar {
  zip64 = true
  archiveBaseName = 'simonaAPI'
}

// scapegoat hook configuration
// Configure Scapegoat compiler plugin for all Scala compile tasks.
// see https://docs.gradle.org/current/userguide/scala_plugin.html#sec:configure_scala_classpath for details
tasks.withType(ScalaCompile).configureEach {
  scalaCompileOptions.additionalParameters = scala3compilerOptions + [
    "-Xplugin:" + configurations.scalaCompilerPlugin.asPath,
    "-P:scapegoat:dataDir:" + project.layout.buildDirectory.get().asFile.absolutePath + "/reports/scapegoat/src/",
    "-P:scapegoat:disabledInspections:TryGet:ComparingFloatingPointTypes"
  ]
  scalaCompileOptions.forkOptions.jvmArgs = [
    '-Xss2m',
    '-XX:-UseGCOverheadLimit',
    '-Xmx4g'
  ]
}

// separate scapegoat report for test classes
compileTestScala {
  scalaCompileOptions.additionalParameters = scalaCompileOptions.additionalParameters + [
    "-P:scapegoat:dataDir:" + project.layout.buildDirectory.get().asFile.absolutePath + "/reports/scapegoat/testsrc/"
  ]
  scalaCompileOptions.forkOptions.jvmArgs = [
    '-Xss2m',
    '-XX:-UseGCOverheadLimit',
    '-Xmx4g'
  ]
}

tasks.register('printVersion') {
  doLast {
    println project.version
  }
}
